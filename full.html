<head>

<meta name="color-scheme" content="light">
<title>공공기관 채용 대시보드 · 2026-10-27</title>
<style>
:root{
  --bg:#f6f4fc; --card:#ffffff; --ink:#2b2540; --muted:#7a7391; --line:#ebe7f5;
  --accent:#7c5cff; --accent-2:#a58bff; --accent-soft:#efeaff;
  --red:#ff6b81; --red-soft:#ffe6ea; --orange:#ff9f43; --orange-soft:#fff1e2;
  --yellow:#e0b100; --yellow-soft:#fff8d9; --green:#2bb673; --green-soft:#e3f7ec;
  --blue:#4d8dff; --blue-soft:#e6efff; --gray-soft:#f0eef5;
  --shadow:0 2px 10px rgba(80,60,160,.06),0 1px 2px rgba(80,60,160,.05);
  --radius:16px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;word-break:keep-all}
a{color:inherit}
.wrap{max-width:1280px;margin:0 auto;padding:20px 20px 40px}
header.top{background:linear-gradient(135deg,#8b6dff 0%,#a68cff 55%,#c6b4ff 100%);color:#fff;border-radius:22px;padding:22px 24px;box-shadow:0 8px 24px rgba(124,92,255,.25)}
.top h1{margin:0;font-size:22px;letter-spacing:-.3px}
.top .sub{opacity:.9;font-size:13px;margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.stat{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.28);border-radius:14px;padding:10px 14px;cursor:pointer;transition:background .15s;text-align:left;color:#fff;font:inherit}
.stat:hover{background:rgba(255,255,255,.28)}
.stat .n{font-size:24px;font-weight:800;line-height:1.2}
.stat .l{font-size:12px;opacity:.92}
.controls{position:sticky;top:0;z-index:5;background:rgba(246,244,252,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:14px 0 10px;margin-top:6px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search{flex:1 1 280px;position:relative}
.search input{width:100%;padding:11px 14px 11px 38px;border:1px solid var(--line);border-radius:12px;background:#fff;font:inherit;color:var(--ink);outline:none;box-shadow:var(--shadow)}
.search input:focus{border-color:var(--accent-2);box-shadow:0 0 0 3px var(--accent-soft)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.5}
select{padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;font:inherit;color:var(--ink);box-shadow:var(--shadow);cursor:pointer}
.chips{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer;transition:all .12s;white-space:nowrap}
.chip:hover{border-color:var(--accent-2)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip .c{opacity:.65;font-size:12px;margin-left:3px}
.chip.on .c{opacity:.85}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.meta{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px;margin:6px 2px 10px;gap:8px;flex-wrap:wrap}
.reset{background:none;border:none;color:var(--accent);font:inherit;font-size:13px;cursor:pointer;padding:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px 12px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;position:relative;transition:transform .12s,box-shadow .12s}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(80,60,160,.10)}
.card.closed{opacity:.55}
.card-top{display:flex;align-items:flex-start;gap:8px}
.org{font-size:13px;color:var(--accent);font-weight:700;flex:1;min-width:0}
.title{font-size:15.5px;font-weight:700;line-height:1.42;margin:0;color:var(--ink);text-decoration:none;display:block}
.title:hover{color:var(--accent)}
.badges{display:flex;gap:6px;align-items:center;flex-shrink:0}
.dday{font-size:12px;font-weight:800;border-radius:8px;padding:3px 8px;white-space:nowrap}
.d-urgent{background:var(--red-soft);color:#e5405e}
.d-soon{background:var(--orange-soft);color:#d97a16}
.d-mid{background:var(--yellow-soft);color:#a07d00}
.d-far{background:var(--green-soft);color:#1f9a5e}
.d-closed{background:var(--gray-soft);color:var(--muted)}
.new{font-size:11px;font-weight:800;background:var(--accent);color:#fff;border-radius:6px;padding:2px 6px;letter-spacing:.3px}
.star{background:none;border:none;cursor:pointer;font-size:20px;line-height:1;padding:0 2px;color:#d4cfe3;transition:transform .1s}
.star:hover{transform:scale(1.15)}
.star.on{color:#ffb800}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{font-size:12px;border-radius:999px;padding:3px 9px;background:var(--gray-soft);color:#5d5675}
.p-정규직{background:var(--accent-soft);color:#5b3fe0}
.p-무기계약직{background:var(--blue-soft);color:#2f6fe0}
.p-비정규직{background:var(--gray-soft);color:#5d5675}
.p-청년인턴체험형{background:var(--green-soft);color:#1f9a5e}
.p-청년인턴채용형{background:#ffe9f5;color:#c63d8f}
.p-loc{background:#fff;border:1px solid var(--line)}
.card-foot{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted);margin-top:auto;padding-top:6px;border-top:1px dashed var(--line)}
.go{color:var(--accent);text-decoration:none;font-weight:700;white-space:nowrap}
.go:hover{text-decoration:underline}
.itnote{font-size:12.5px;line-height:1.45;color:#5b3fe0;background:var(--accent-soft);border-radius:10px;padding:6px 9px}
.itnote .b{opacity:.75;font-size:11.5px;display:block;margin-top:2px;color:var(--muted)}
.p-late{background:var(--orange-soft);color:#d97a16}
.empty{text-align:center;color:var(--muted);padding:60px 10px;background:#fff;border-radius:var(--radius);border:1px dashed var(--line)}
.more{display:block;margin:16px auto 0;padding:10px 22px;border-radius:12px;border:1px solid var(--accent-2);background:#fff;color:var(--accent);font:inherit;font-weight:700;cursor:pointer}
footer{margin-top:28px;text-align:center;color:var(--muted);font-size:12.5px;line-height:1.7}
footer a{color:var(--accent)}
@media (max-width:640px){
  .wrap{padding:12px 12px 32px}
  header.top{padding:18px 16px;border-radius:18px}
  .top h1{font-size:19px}
  .stat{padding:8px 10px}
  .stat .n{font-size:20px}
  .grid{grid-template-columns:1fr}
  .chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  select{flex:1 1 40%}
  .sep{display:none}
}
</style>
</head>

<script>
(function(){
  'use strict';
  var D = JSON.parse(document.getElementById('data').textContent);
  var P = D.postings || [];
  var FAV_KEY = 'alio_jobs_favs_v1';
  var favs = {};
  try { favs = JSON.parse(localStorage.getItem(FAV_KEY) || '{}') || {}; } catch(e) { favs = {}; }
  function saveFavs(){ try { localStorage.setItem(FAV_KEY, JSON.stringify(favs)); } catch(e){} }

  // today in Asia/Seoul
  function kstToday(){
    var now = new Date(Date.now() + 9*3600*1000);
    return new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate()));
  }
  var TODAY = kstToday();
  function parseISO(s){ var a=s.split('-'); return new Date(Date.UTC(+a[0], +a[1]-1, +a[2])); }
  var dow = (TODAY.getUTCDay()+6)%7; // Mon=0
  var weekEnd = new Date(TODAY.getTime() + (6-dow)*86400000);
  P.forEach(function(p){
    var d = parseISO(p.deadline);
    p._d = Math.round((d - TODAY)/86400000);
    p._week = p._d >= 0 && d <= weekEnd;
    p._hay = (p.org + ' ' + p.title + ' ' + (p.it_note||'')).toLowerCase();
  });
  var open = P.filter(function(p){ return p._d >= 0; });

  // header
  document.getElementById('upd').textContent = (D.generated_at || D.date).replace('T',' ').replace('+09:00',' KST');
  document.getElementById('s-total').textContent = open.length;
  var newCount = open.filter(function(p){return p.is_new;}).length;
  document.getElementById('s-new').textContent = D.first_load ? '–' : newCount;
  if (D.first_load) document.getElementById('s-new-l').textContent = '신규 (첫 수집)';
  document.getElementById('s-week').textContent = open.filter(function(p){return p._week;}).length;

  // state
  var S = { q:'', loc:'', types:{}, onlyNew:false, urgent:false, week:false, fav:false, showClosed:false, sort:'deadline', limit:60 };

  // chips
  var TYPE_ORDER = ['정규직','무기계약직','비정규직','청년인턴(채용형)','청년인턴(체험형)'];
  var typeCounts = {};
  open.forEach(function(p){ typeCounts[p.emp_type] = (typeCounts[p.emp_type]||0)+1; });
  var types = Object.keys(typeCounts).sort(function(a,b){
    var ia=TYPE_ORDER.indexOf(a), ib=TYPE_ORDER.indexOf(b);
    return (ia<0?99:ia)-(ib<0?99:ib) || a.localeCompare(b);
  });
  var chipsEl = document.getElementById('chips');
  function chip(label, count, key, val){
    var b = document.createElement('button');
    b.className = 'chip'; b.type='button';
    b.dataset.key = key; if (val!=null) b.dataset.val = val;
    b.innerHTML = esc(label) + (count!=null ? '<span class="c">'+count+'</span>' : '');
    chipsEl.appendChild(b); return b;
  }
  types.forEach(function(t){ chip(t, typeCounts[t], 'type', t); });
  var s1 = document.createElement('span'); s1.className='sep'; chipsEl.appendChild(s1);
  chip('🆕 신규만', D.first_load?null:newCount, 'onlyNew');
  chip('🔥 마감 임박(D-7)', open.filter(function(p){return p._d<=7;}).length, 'urgent');
  chip('📅 이번 주 마감', null, 'week');
  chip('⭐ 즐겨찾기', null, 'fav');

  // location dropdown
  var locCounts = {};
  open.forEach(function(p){ locCounts[p.location]=(locCounts[p.location]||0)+1; });
  var locSel = document.getElementById('loc');
  Object.keys(locCounts).sort(function(a,b){return locCounts[b]-locCounts[a];}).forEach(function(l){
    var o=document.createElement('option'); o.value=l; o.textContent=l+' ('+locCounts[l]+')'; locSel.appendChild(o);
  });

  function esc(s){ return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function ddayCls(d){ if(d<0) return 'd-closed'; if(d<=3) return 'd-urgent'; if(d<=7) return 'd-soon'; if(d<=14) return 'd-mid'; return 'd-far'; }
  function ddayTxt(d){ return d<0 ? '마감' : d===0 ? 'D-Day' : 'D-'+d; }
  function fmt(iso){ var a=iso.split('-'); return a[0].slice(2)+'.'+a[1]+'.'+a[2]; }
  function typeCls(t){ return 'p-'+t.replace(/[()\s]/g,''); }

  function filtered(){
    var q = S.q.trim().toLowerCase();
    var terms = q ? q.split(/\s+/) : [];
    var anyType = Object.keys(S.types).some(function(k){return S.types[k];});
    var list = (S.showClosed ? P : open).filter(function(p){
      if (terms.length && !terms.every(function(t){return p._hay.indexOf(t)>=0;})) return false;
      if (S.loc && p.location !== S.loc) return false;
      if (anyType && !S.types[p.emp_type]) return false;
      if (S.onlyNew && !p.is_new) return false;
      if (S.urgent && !(p._d>=0 && p._d<=7)) return false;
      if (S.week && !p._week) return false;
      if (S.fav && !favs[p.id]) return false;
      return true;
    });
    list.sort(S.sort==='reg'
      ? function(a,b){ return b.reg_date.localeCompare(a.reg_date) || a._d-b._d || b.no-a.no; }
      : function(a,b){ return a._d-b._d || b.reg_date.localeCompare(a.reg_date) || b.no-a.no; });
    return list;
  }

  var grid = document.getElementById('grid');
  function card(p){
    var fav = !!favs[p.id];
    var locTxt = p.location + (p.location_more ? ' 외 '+p.location_more : '');
    var typeTxt = p.emp_type + (p.emp_more ? ' 외 '+p.emp_more : '');
    return '<article class="card'+(p._d<0?' closed':'')+'" data-id="'+p.id+'">'+
      '<div class="card-top"><div class="org">'+esc(p.org)+'</div><div class="badges">'+
        (p.is_new?'<span class="new">NEW</span>':'')+
        '<span class="dday '+ddayCls(p._d)+'">'+ddayTxt(p._d)+'</span>'+
        '<button class="star'+(fav?' on':'')+'" type="button" aria-label="즐겨찾기" title="즐겨찾기" data-fav="'+p.id+'">'+(fav?'★':'☆')+'</button>'+
      '</div></div>'+
      '<a class="title" href="'+esc(p.url)+'" target="_blank" rel="noopener">'+esc(p.title)+'</a>'+
      '<div class="pills"><span class="pill '+typeCls(p.emp_type)+'">'+esc(typeTxt)+'</span><span class="pill p-loc">📍 '+esc(locTxt)+'</span>'+
        (p.added_after_sweep?'<span class="pill p-late">오늘 추가 등록</span>':'')+'</div>'+
      ((p.it_note||p.it_basis)?'<div class="itnote">'+(p.it_note?'💻 '+esc(p.it_note):'')+(p.it_basis?'<span class="b">근거: '+esc(p.it_basis)+'</span>':'')+'</div>':'')+
      '<div class="card-foot"><span>'+fmt(p.reg_date)+' ~ '+fmt(p.deadline)+'</span>'+
      '<a class="go" href="'+esc(p.url)+'" target="_blank" rel="noopener">공고 보기 ↗</a></div>'+
    '</article>';
  }

  function render(){
    var list = filtered();
    var shown = list.slice(0, S.limit);
    grid.innerHTML = shown.length ? shown.map(card).join('') :
      '<div class="empty">조건에 맞는 공고가 없어요 🫥<br><small>필터를 조정해 보세요.</small></div>';
    document.getElementById('count').textContent = '검색 결과 ' + list.length + '건' + (list.length>shown.length ? ' · '+shown.length+'건 표시' : '');
    var more = document.getElementById('more');
    more.hidden = list.length <= shown.length;
    more.textContent = '더 보기 (' + (list.length-shown.length) + '건 남음)';
    Array.prototype.forEach.call(chipsEl.children, function(b){
      if (!b.dataset.key) return;
      var k=b.dataset.key, on = k==='type' ? !!S.types[b.dataset.val] : !!S[k];
      b.classList.toggle('on', on);
    });
  }

  // events
  var t;
  document.getElementById('q').addEventListener('input', function(e){
    clearTimeout(t); var v=e.target.value; t=setTimeout(function(){ S.q=v; S.limit=60; render(); }, 120);
  });
  locSel.addEventListener('change', function(e){ S.loc=e.target.value; S.limit=60; render(); });
  document.getElementById('sort').addEventListener('change', function(e){ S.sort=e.target.value; render(); });
  chipsEl.addEventListener('click', function(e){
    var b = e.target.closest('.chip'); if(!b) return;
    var k=b.dataset.key;
    if (k==='type') S.types[b.dataset.val] = !S.types[b.dataset.val]; else S[k] = !S[k];
    S.limit=60; render();
  });
  grid.addEventListener('click', function(e){
    var b = e.target.closest('[data-fav]'); if(!b) return;
    var id=b.dataset.fav;
    if (favs[id]) delete favs[id]; else favs[id]=1;
    saveFavs();
    if (S.fav) render(); else { b.classList.toggle('on', !!favs[id]); b.textContent = favs[id]?'★':'☆'; }
  });
  document.getElementById('more').addEventListener('click', function(){ S.limit += 60; render(); });
  function reset(){
    S.q=''; S.loc=''; S.types={}; S.onlyNew=false; S.urgent=false; S.week=false; S.fav=false; S.limit=60;
    document.getElementById('q').value=''; locSel.value='';
  }
  document.getElementById('reset').addEventListener('click', function(){ reset(); render(); });
  Array.prototype.forEach.call(document.querySelectorAll('.stat'), function(b){
    b.addEventListener('click', function(){
      reset(); var k=b.dataset.quick;
      if (k==='new') S.onlyNew=true; if (k==='week') S.week=true;
      render(); document.querySelector('.controls').scrollIntoView({behavior:'smooth'});
    });
  });
  render();
})();
</script>
</body>
</html>
